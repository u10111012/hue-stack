<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hue Stack</title>
<meta name="description" content="Hue Stack — an original one-finger color-sorting puzzle with a pressure twist.">
<style>
  :root{
    --bg-top:#1e1b4b;
    --bg-bottom:#0f172a;
    --panel:#ffffff14;
    --panel-strong:#ffffff22;
    --text:#f8fafc;
    --text-dim:#cbd5e199;
    --accent:#facc15;
    --danger:#ef4444;
    --radius-lg:20px;
    --radius-md:12px;
    --tube-w:min(15vw,58px);
    --tube-gap:10px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    padding:calc(10px + var(--safe-top)) 12px calc(10px + var(--safe-bottom));
    overflow:hidden;
  }
  #app.shake-screen{ animation:screenShake 320ms ease; }
  @keyframes screenShake{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-6px,2px);}
    40%{transform:translate(5px,-3px);}
    60%{transform:translate(-4px,3px);}
    80%{transform:translate(3px,-2px);}
  }

  /* Top bar */
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 4px;flex:0 0 auto;
  }
  .score-block{display:flex;flex-direction:column;line-height:1.05;}
  .score-block .label{font-size:11px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;}
  .score-block .value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;transition:transform 120ms ease;}
  .score-block .value.bump{transform:scale(1.18);}
  #best-block{align-items:flex-end;text-align:right;}
  #icon-buttons{display:flex;gap:8px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;
    background:var(--panel);color:var(--text);font-size:17px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn:active{background:var(--panel-strong);}

  /* Combo + drip strip */
  #hud-strip{
    display:flex;align-items:center;justify-content:center;gap:14px;
    min-height:26px;flex:0 0 auto;margin-bottom:2px;
  }
  #combo-tag{
    font-size:13px;font-weight:800;color:#0f172a;background:var(--accent);
    padding:2px 10px;border-radius:999px;opacity:0;transform:scale(.7);
    transition:opacity 160ms ease, transform 160ms ease;
  }
  #combo-tag.show{opacity:1;transform:scale(1);}
  #drip-indicator{display:flex;align-items:center;gap:5px;}
  #drip-indicator .drip-label{font-size:10px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;margin-right:2px;}
  .drip-dot{width:7px;height:7px;border-radius:50%;background:#475569;transition:background 150ms ease,transform 150ms ease;}
  .drip-dot.filled{background:#38bdf8;transform:scale(1.15);}

  /* Board */
  #board-wrap{
    flex:1 1 auto;display:flex;align-items:center;justify-content:center;
    min-height:0;
  }
  #board{
    display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;
    gap:var(--tube-gap) calc(var(--tube-gap) * 1.4);
    max-width:520px;
  }
  .tube{
    width:var(--tube-w);
    display:flex;flex-direction:column-reverse;
    align-items:center;justify-content:flex-start;
    padding:6px 5px;gap:5px;
    background:var(--panel);
    border:2px solid #ffffff20;
    border-radius:0 0 16px 16px;
    border-top:none;
    position:relative;
    height:calc(var(--tube-w) * 4 + 34px);
    transition:transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
  }
  .tube::before{
    content:"";position:absolute;left:-2px;right:-2px;top:-8px;height:8px;
    border-left:2px solid #ffffff20;border-right:2px solid #ffffff20;
  }
  .tube.selected{
    transform:translateY(-10px);
    border-color:var(--accent);
    box-shadow:0 8px 22px -6px #000000aa, 0 0 0 2px #facc1555;
  }
  .tube.shake{ animation:tubeShake 300ms ease; }
  @keyframes tubeShake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  .block{
    width:100%;aspect-ratio:1/1;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 -4px 0 #00000030, inset 0 3px 0 #ffffff40, 0 2px 4px #00000040;
    position:relative;flex:0 0 auto;
  }
  .block.pop-in{ animation:popIn 260ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn{
    0%{transform:translateY(-26px) scale(.6);opacity:0;}
    60%{transform:translateY(3px) scale(1.08);opacity:1;}
    100%{transform:translateY(0) scale(1);}
  }
  .block.clearing{ animation:clearOut 340ms ease forwards; }
  @keyframes clearOut{
    0%{transform:scale(1);opacity:1;}
    40%{transform:scale(1.25);opacity:1;}
    100%{transform:scale(.2);opacity:0;}
  }
  .shape{width:46%;height:46%;background:#ffffffd0;}
  .shape-circle{border-radius:50%;}
  .shape-square{border-radius:2px;}
  .shape-diamond{transform:rotate(45deg);border-radius:2px;width:36%;height:36%;}
  .shape-triangle{
    width:0;height:0;background:none!important;
    border-left:11px solid transparent;border-right:11px solid transparent;
    border-bottom:19px solid #ffffffd0;
  }
  .shape-star{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
  .shape-hex{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%);}

  .empty-slot{width:100%;aspect-ratio:1/1;border-radius:8px;border:2px dashed #ffffff1a;flex:0 0 auto;}

  /* particles */
  .particle{
    position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;
    z-index:50;
  }

  /* Controls */
  #controls{
    display:flex;justify-content:center;gap:14px;
    padding:8px 0 2px;flex:0 0 auto;
  }
  .ctrl-btn{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:var(--panel);border:none;border-radius:var(--radius-md);
    color:var(--text);padding:8px 16px;min-width:76px;cursor:pointer;
  }
  .ctrl-btn .ic{font-size:18px;}
  .ctrl-btn .ct{font-size:10px;color:var(--text-dim);}
  .ctrl-btn:disabled{opacity:.35;}
  .ctrl-btn:active:not(:disabled){background:var(--panel-strong);}

  /* Overlays */
  .overlay{
    position:fixed;inset:0;background:#0f172aee;
    display:flex;align-items:center;justify-content:center;
    padding:24px;z-index:100;opacity:0;pointer-events:none;
    transition:opacity 180ms ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .card{
    background:#1e293bf5;border:1px solid #ffffff1a;border-radius:var(--radius-lg);
    padding:26px 22px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 20px 50px -12px #000000aa;
  }
  .card h2{margin:0 0 6px;font-size:24px;}
  .card .sub{color:var(--text-dim);font-size:13px;margin-bottom:18px;}
  .big-btn{
    width:100%;padding:14px;border:none;border-radius:14px;
    background:var(--accent);color:#0f172a;font-weight:800;font-size:16px;
    cursor:pointer;margin-top:6px;
  }
  .big-btn:active{transform:scale(.98);}
  .ghost-btn{
    width:100%;padding:12px;border:none;border-radius:14px;
    background:transparent;color:var(--text-dim);font-size:13px;
    cursor:pointer;margin-top:8px;
  }
  .final-score{font-size:44px;font-weight:900;color:var(--accent);margin:6px 0;}
  .best-line{font-size:13px;color:var(--text-dim);}
  .best-line b{color:var(--text);}

  /* Tutorial */
  #tutorial-overlay .tut-steps{display:flex;justify-content:center;gap:16px;margin:14px 0 6px;}
  .tut-step{display:flex;flex-direction:column;align-items:center;gap:6px;width:78px;}
  .tut-icon{
    width:52px;height:52px;border-radius:14px;background:var(--panel-strong);
    display:flex;align-items:center;justify-content:center;font-size:24px;
  }
  .tut-step .tt{font-size:11px;color:var(--text-dim);}
  .tut-arrow{align-self:center;font-size:18px;color:var(--text-dim);margin-top:20px;}

  /* Settings */
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 2px;border-bottom:1px solid #ffffff14;text-align:left;
  }
  .setting-row:last-of-type{border-bottom:none;}
  .setting-row .st-label{font-size:14px;}
  .switch{
    width:44px;height:26px;border-radius:999px;background:#475569;
    position:relative;cursor:pointer;flex:0 0 auto;transition:background 150ms ease;
  }
  .switch.on{background:var(--accent);}
  .switch .knob{
    position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:transform 150ms ease;
  }
  .switch.on .knob{transform:translateX(18px);}

  @media (max-width:380px){
    :root{ --tube-w:15vw; }
    .card{padding:20px 16px;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="score-block" id="score-block">
      <span class="label">Score</span>
      <span class="value" id="score-value">0</span>
    </div>
    <div id="icon-buttons">
      <button class="icon-btn" id="mute-btn" aria-label="Mute">🔊</button>
      <button class="icon-btn" id="settings-btn" aria-label="Settings">⚙️</button>
    </div>
    <div class="score-block" id="best-block">
      <span class="label">Best</span>
      <span class="value" id="best-value">0</span>
    </div>
  </div>

  <div id="hud-strip">
    <span id="combo-tag">x2 COMBO</span>
    <div id="drip-indicator">
      <span class="drip-label">Drip</span>
      <span id="drip-dots"></span>
    </div>
  </div>

  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="undo-btn">
      <span class="ic">↺</span>
      <span class="ct">Undo (<span id="undo-count">2</span>)</span>
    </button>
    <button class="ctrl-btn" id="shuffle-btn">
      <span class="ic">🔀</span>
      <span class="ct">Shuffle (<span id="shuffle-count">1</span>)</span>
    </button>
  </div>
</div>

<!-- Tutorial overlay -->
<div class="overlay" id="tutorial-overlay">
  <div class="card">
    <h2>How to play</h2>
    <div class="sub">Sort colors into matching tubes before they overflow.</div>
    <div class="tut-steps">
      <div class="tut-step"><div class="tut-icon">👆</div><div class="tt">Tap a tube</div></div>
      <div class="tut-step"><div class="tut-icon">🎯</div><div class="tt">Tap target</div></div>
      <div class="tut-step"><div class="tut-icon">✨</div><div class="tt">Fill 4 = clear!</div></div>
    </div>
    <button class="big-btn" id="tutorial-dismiss">Got it</button>
  </div>
</div>

<!-- Game over overlay -->
<div class="overlay" id="gameover-overlay">
  <div class="card">
    <h2>Tubes overflowed!</h2>
    <div class="final-score" id="final-score">0</div>
    <div class="best-line" id="best-line">Best: <b>0</b></div>
    <button class="big-btn" id="play-again-btn">Play Again</button>
  </div>
</div>

<!-- Settings overlay -->
<div class="overlay" id="settings-overlay">
  <div class="card">
    <h2>Settings</h2>
    <div class="setting-row">
      <span class="st-label">Colorblind patterns</span>
      <div class="switch on" id="pattern-switch"><div class="knob"></div></div>
    </div>
    <div class="setting-row">
      <span class="st-label">Sound</span>
      <div class="switch on" id="sound-switch"><div class="knob"></div></div>
    </div>
    <button class="ghost-btn" id="settings-close">Close</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================================
   PLATFORM ABSTRACTION LAYER
   All host/SDK-specific calls live here. To port to the YouTube Playables
   SDK later, only this object needs to change.
   ========================================================================= */
const Platform = (function(){
  let pauseCb = null, resumeCb = null;
  let audioEnabled = true;
  let memoryFallback = {};

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) { if (pauseCb) pauseCb(); }
    else { if (resumeCb) resumeCb(); }
  });
  window.addEventListener('blur', function(){ if (pauseCb) pauseCb(); });
  window.addEventListener('focus', function(){ if (resumeCb) resumeCb(); });

  return {
    loadData: function(){
      return new Promise(function(resolve){
        try {
          const raw = window.localStorage.getItem('huestack_save');
          resolve(raw ? JSON.parse(raw) : {});
        } catch (e) {
          resolve(Object.assign({}, memoryFallback));
        }
      });
    },
    saveData: function(obj){
      return new Promise(function(resolve){
        try {
          window.localStorage.setItem('huestack_save', JSON.stringify(obj));
        } catch (e) {
          memoryFallback = Object.assign({}, obj);
        }
        resolve();
      });
    },
    isAudioEnabled: function(){ return audioEnabled; },
    setAudioEnabled: function(v){ audioEnabled = v; },
    onPause: function(cb){ pauseCb = cb; },
    onResume: function(cb){ resumeCb = cb; },
    firstFrameReady: function(){ /* no-op stub: call once first frame is painted */ },
    gameReady: function(){ /* no-op stub: call once the game is interactive */ },
    showRewardedAd: function(){ return Promise.resolve(true); },
    showInterstitial: function(){ return Promise.resolve(); }
  };
})();

/* =========================================================================
   CONFIG — every tunable number lives here.
   ========================================================================= */
const CONFIG = {
  TUBE_CAPACITY: 4,
  START_FILLED_TUBES: 4,
  START_EMPTY_TUBES: 2,
  START_COLOR_COUNT: 4,
  COLOR_STAGE2_COUNT: 5,
  COLOR_STAGE2_SCORE: 250,
  COLOR_STAGE3_COUNT: 6,
  COLOR_STAGE3_SCORE: 900,
  DRIP_INTERVAL_START: 6,
  DRIP_INTERVAL_MIN: 2,
  DRIP_DECREASE_SCORE_STEP: 150,
  SCORE_PER_BLOCK: 25,
  COMBO_WINDOW_MOVES: 3,
  UNDO_LIMIT: 2,
  SHUFFLE_LIMIT: 1,
  ANIM_POP_MS: 260,
  ANIM_CLEAR_MS: 340,
  ANIM_SHAKE_MS: 300,
  DRIP_FALL_MS: 420
};

const COLORS = [
  { hex:'#ef4444', dark:'#b91c1c', shape:'circle' },
  { hex:'#3b82f6', dark:'#1d4ed8', shape:'triangle' },
  { hex:'#22c55e', dark:'#15803d', shape:'square' },
  { hex:'#eab308', dark:'#a16207', shape:'diamond' },
  { hex:'#a855f7', dark:'#7e22ce', shape:'star' },
  { hex:'#06b6d4', dark:'#0e7490', shape:'hex' }
];

/* =========================================================================
   PURE GAME LOGIC
   State model: tubes = array of arrays of color-id ints, index 0 = bottom.
   These functions never touch the DOM and never mutate their inputs.
   ========================================================================= */
function rand(n){ return Math.floor(Math.random() * n); }

function shuffleArr(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = rand(i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function createInitialTubes(cfg){
  const blocks = [];
  for (let c = 0; c < cfg.START_COLOR_COUNT; c++){
    for (let i = 0; i < cfg.TUBE_CAPACITY; i++) blocks.push(c);
  }
  const shuffled = shuffleArr(blocks);
  const tubes = [];
  for (let t = 0; t < cfg.START_FILLED_TUBES; t++){
    tubes.push(shuffled.slice(t * cfg.TUBE_CAPACITY, (t + 1) * cfg.TUBE_CAPACITY));
  }
  for (let t = 0; t < cfg.START_EMPTY_TUBES; t++) tubes.push([]);
  return shuffleArr(tubes);
}

function canMove(tubes, from, to, cap){
  if (from === to) return { legal:false, moveCount:0 };
  const src = tubes[from];
  if (src.length === 0) return { legal:false, moveCount:0 };
  const dst = tubes[to];
  if (dst.length >= cap) return { legal:false, moveCount:0 };
  const topColor = src[src.length - 1];
  if (dst.length > 0 && dst[dst.length - 1] !== topColor) return { legal:false, moveCount:0 };
  let run = 1;
  for (let i = src.length - 2; i >= 0 && src[i] === topColor; i--) run++;
  const space = cap - dst.length;
  const moveCount = Math.min(run, space);
  return { legal: moveCount > 0, moveCount, color: topColor };
}

function applyMove(tubes, from, to, moveCount){
  const next = tubes.map(function(t){ return t.slice(); });
  const moved = [];
  for (let i = 0; i < moveCount; i++) moved.push(next[from].pop());
  moved.reverse();
  next[to] = next[to].concat(moved);
  return next;
}

function checkCompletions(tubes, cap){
  const done = [];
  tubes.forEach(function(t, idx){
    if (t.length === cap && t.every(function(c){ return c === t[0]; })) done.push(idx);
  });
  return done;
}

function clearTubes(tubes, indices){
  const next = tubes.map(function(t){ return t.slice(); });
  indices.forEach(function(i){ next[i] = []; });
  return next;
}

function legalMoveExists(tubes, cap){
  for (let i = 0; i < tubes.length; i++){
    for (let j = 0; j < tubes.length; j++){
      if (i === j) continue;
      if (canMove(tubes, i, j, cap).legal) return true;
    }
  }
  return false;
}

function isGameOver(tubes, cap){
  const allFull = tubes.every(function(t){ return t.length === cap; });
  return allFull && !legalMoveExists(tubes, cap);
}

function colorsUnlocked(cfg, score){
  if (score >= cfg.COLOR_STAGE3_SCORE) return cfg.COLOR_STAGE3_COUNT;
  if (score >= cfg.COLOR_STAGE2_SCORE) return cfg.COLOR_STAGE2_COUNT;
  return cfg.START_COLOR_COUNT;
}

function currentDripInterval(cfg, score){
  return Math.max(
    cfg.DRIP_INTERVAL_MIN,
    cfg.DRIP_INTERVAL_START - Math.floor(score / cfg.DRIP_DECREASE_SCORE_STEP)
  );
}

// Never targets a full tube. Returns {tubes, tubeIndex, color} or null if no room anywhere.
function dripToRandomTube(tubes, cfg, score){
  const cap = cfg.TUBE_CAPACITY;
  const candidates = [];
  tubes.forEach(function(t, i){ if (t.length < cap) candidates.push(i); });
  if (candidates.length === 0) return null;
  const idx = candidates[rand(candidates.length)];
  const colorCount = colorsUnlocked(cfg, score);
  const color = rand(colorCount);
  const next = tubes.map(function(t){ return t.slice(); });
  next[idx].push(color);
  return { tubes: next, tubeIndex: idx, color: color };
}

// Redistributes all existing blocks randomly across the same tubes (same capacity).
function shuffleBoard(tubes, cap){
  const allBlocks = [];
  tubes.forEach(function(t){ t.forEach(function(c){ allBlocks.push(c); }); });
  const shuffled = shuffleArr(allBlocks);
  const counts = tubes.map(function(t){ return t.length; });
  const next = [];
  let p = 0;
  for (let i = 0; i < tubes.length; i++){
    next.push(shuffled.slice(p, p + counts[i]));
    p += counts[i];
  }
  return next;
}

/* =========================================================================
   AUDIO — synthesized with Web Audio API, no audio files.
   ========================================================================= */
const Audio_ = (function(){
  let ctx = null;
  function ensureCtx(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, gainPeak, delay){
    if (!Platform.isAudioEnabled()) return;
    const c = ensureCtx();
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.18, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  return {
    unlock: function(){ ensureCtx(); },
    select: function(){ tone(520, 0.08, 'sine', 0.12); },
    move: function(){ tone(340, 0.09, 'triangle', 0.14); },
    drip: function(){ tone(660, 0.12, 'sine', 0.10); },
    complete: function(combo){
      const base = 440 + Math.min(combo, 6) * 60;
      tone(base, 0.16, 'triangle', 0.2);
      tone(base * 1.5, 0.18, 'sine', 0.14, 0.05);
    },
    error: function(){ tone(160, 0.16, 'sawtooth', 0.12); },
    gameOver: function(){
      tone(300, 0.22, 'sine', 0.16);
      tone(220, 0.28, 'sine', 0.14, 0.16);
      tone(140, 0.4, 'sine', 0.12, 0.32);
    }
  };
})();

/* =========================================================================
   GAME STATE + CONTROLLER
   ========================================================================= */
const state = {
  tubes: [],
  score: 0,
  best: 0,
  combo: 1,
  movesSinceComplete: 999,
  movesSinceDrip: 0,
  selected: null,
  undoLeft: CONFIG.UNDO_LIMIT,
  shuffleLeft: CONFIG.SHUFFLE_LIMIT,
  history: null,
  running: false,
  paused: false,
  settings: { patterns: true, sound: true },
  seenTutorial: false
};

function snapshotForUndo(){
  return {
    tubes: state.tubes.map(function(t){ return t.slice(); }),
    score: state.score,
    combo: state.combo,
    movesSinceComplete: state.movesSinceComplete,
    movesSinceDrip: state.movesSinceDrip
  };
}

function newGame(){
  state.tubes = createInitialTubes(CONFIG);
  state.score = 0;
  state.combo = 1;
  state.movesSinceComplete = 999;
  state.movesSinceDrip = 0;
  state.selected = null;
  state.undoLeft = CONFIG.UNDO_LIMIT;
  state.shuffleLeft = CONFIG.SHUFFLE_LIMIT;
  state.history = null;
  state.running = true;
  el.gameover.classList.remove('show');
  updateControlsUI();
  renderBoard(true);
  updateScoreUI(false);
  updateDripUI();
}

/* =========================================================================
   DOM REFS
   ========================================================================= */
const el = {
  app: document.getElementById('app'),
  board: document.getElementById('board'),
  scoreValue: document.getElementById('score-value'),
  scoreBlock: document.getElementById('score-block'),
  bestValue: document.getElementById('best-value'),
  comboTag: document.getElementById('combo-tag'),
  dripDots: document.getElementById('drip-dots'),
  undoBtn: document.getElementById('undo-btn'),
  undoCount: document.getElementById('undo-count'),
  shuffleBtn: document.getElementById('shuffle-btn'),
  shuffleCount: document.getElementById('shuffle-count'),
  muteBtn: document.getElementById('mute-btn'),
  settingsBtn: document.getElementById('settings-btn'),
  tutorial: document.getElementById('tutorial-overlay'),
  tutorialDismiss: document.getElementById('tutorial-dismiss'),
  gameover: document.getElementById('gameover-overlay'),
  finalScore: document.getElementById('final-score'),
  bestLine: document.getElementById('best-line'),
  playAgainBtn: document.getElementById('play-again-btn'),
  settings: document.getElementById('settings-overlay'),
  settingsClose: document.getElementById('settings-close'),
  patternSwitch: document.getElementById('pattern-switch'),
  soundSwitch: document.getElementById('sound-switch')
};

/* =========================================================================
   RENDER
   ========================================================================= */
function renderBoard(instant){
  el.board.innerHTML = '';
  state.tubes.forEach(function(tube, tubeIdx){
    const tubeEl = document.createElement('div');
    tubeEl.className = 'tube' + (state.selected === tubeIdx ? ' selected' : '');
    tubeEl.dataset.idx = tubeIdx;

    for (let slot = 0; slot < CONFIG.TUBE_CAPACITY; slot++){
      if (slot < tube.length){
        const colorId = tube[slot];
        const blockEl = document.createElement('div');
        blockEl.className = 'block' + (instant ? '' : ' pop-in');
        blockEl.style.background = 'linear-gradient(160deg,' + COLORS[colorId].hex + ',' + COLORS[colorId].dark + ')';
        if (state.settings.patterns){
          const shape = document.createElement('div');
          shape.className = 'shape shape-' + COLORS[colorId].shape;
          blockEl.appendChild(shape);
        }
        tubeEl.appendChild(blockEl);
      } else {
        const emptyEl = document.createElement('div');
        emptyEl.className = 'empty-slot';
        tubeEl.appendChild(emptyEl);
      }
    }

    tubeEl.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      onTubeTap(tubeIdx);
    });
    el.board.appendChild(tubeEl);
  });
}

function updateScoreUI(bump){
  el.scoreValue.textContent = state.score;
  el.bestValue.textContent = state.best;
  if (bump){
    el.scoreBlock.querySelector('.value').classList.remove('bump');
    void el.scoreBlock.offsetWidth;
    el.scoreBlock.querySelector('.value').classList.add('bump');
  }
}

function updateComboUI(){
  if (state.combo > 1){
    el.comboTag.textContent = 'x' + state.combo + ' COMBO';
    el.comboTag.classList.add('show');
  } else {
    el.comboTag.classList.remove('show');
  }
}

function updateDripUI(){
  const interval = currentDripInterval(CONFIG, state.score);
  el.dripDots.innerHTML = '';
  const remaining = Math.max(0, interval - state.movesSinceDrip);
  for (let i = 0; i < interval; i++){
    const dot = document.createElement('span');
    dot.className = 'drip-dot' + (i < (interval - remaining) ? ' filled' : '');
    el.dripDots.appendChild(dot);
  }
}

function updateControlsUI(){
  el.undoCount.textContent = state.undoLeft;
  el.shuffleCount.textContent = state.shuffleLeft;
  el.undoBtn.disabled = state.undoLeft <= 0 || !state.history;
  el.shuffleBtn.disabled = state.shuffleLeft <= 0;
}

function flashTubeShake(tubeIdx){
  const tubeEl = el.board.querySelector('[data-idx="' + tubeIdx + '"]');
  if (!tubeEl) return;
  tubeEl.classList.remove('shake');
  void tubeEl.offsetWidth;
  tubeEl.classList.add('shake');
  setTimeout(function(){ tubeEl.classList.remove('shake'); }, CONFIG.ANIM_SHAKE_MS);
}

function burstParticles(tubeIdx, colorId){
  const tubeEl = el.board.querySelector('[data-idx="' + tubeIdx + '"]');
  if (!tubeEl) return;
  const rect = tubeEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < 14; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.background = COLORS[colorId].hex;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    document.body.appendChild(p);
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    p.animate(
      [
        { transform:'translate(0,0) scale(1)', opacity:1 },
        { transform:'translate(' + dx + 'px,' + dy + 'px) scale(.3)', opacity:0 }
      ],
      { duration:500, easing:'cubic-bezier(.2,.8,.4,1)' }
    );
    setTimeout(function(){ p.remove(); }, 520);
  }
}

function maybeScreenShake(){
  if (state.combo >= 3){
    el.app.classList.remove('shake-screen');
    void el.app.offsetWidth;
    el.app.classList.add('shake-screen');
  }
}

/* =========================================================================
   INPUT / MOVE HANDLING
   ========================================================================= */
function onTubeTap(tubeIdx){
  if (!state.running || state.paused) return;
  Audio_.unlock();

  if (state.selected === null){
    if (state.tubes[tubeIdx].length === 0) return;
    state.selected = tubeIdx;
    Audio_.select();
    renderBoard();
    return;
  }

  if (state.selected === tubeIdx){
    state.selected = null;
    renderBoard();
    return;
  }

  const from = state.selected;
  const to = tubeIdx;
  const check = canMove(state.tubes, from, to, CONFIG.TUBE_CAPACITY);

  if (!check.legal){
    Audio_.error();
    flashTubeShake(to);
    state.selected = null;
    renderBoard();
    return;
  }

  state.history = snapshotForUndo();
  state.tubes = applyMove(state.tubes, from, to, check.moveCount);
  state.selected = null;
  state.movesSinceDrip++;
  state.movesSinceComplete++;
  Audio_.move();
  renderBoard();
  updateControlsUI();

  resolveAfterMove(to);
}

function resolveAfterMove(destTubeIdx){
  const completed = checkCompletions(state.tubes, CONFIG.TUBE_CAPACITY);

  if (completed.length > 0){
    if (state.movesSinceComplete <= CONFIG.COMBO_WINDOW_MOVES){
      state.combo++;
    } else {
      state.combo = 1;
    }
    let gained = 0;
    completed.forEach(function(idx){
      const colorId = state.tubes[idx][0];
      gained += CONFIG.TUBE_CAPACITY * CONFIG.SCORE_PER_BLOCK * state.combo;
      burstParticles(idx, colorId);
    });
    state.score += gained;
    state.tubes = clearTubes(state.tubes, completed);
    state.movesSinceComplete = 0;
    Audio_.complete(state.combo);
    maybeScreenShake();
    updateScoreUI(true);
    updateComboUI();
    renderBoard();
  } else if (state.movesSinceComplete > CONFIG.COMBO_WINDOW_MOVES && state.combo > 1){
    state.combo = 1;
    updateComboUI();
  }

  const interval = currentDripInterval(CONFIG, state.score);
  if (state.movesSinceDrip >= interval){
    const dripResult = dripToRandomTube(state.tubes, CONFIG, state.score);
    state.movesSinceDrip = 0;
    if (dripResult){
      setTimeout(function(){
        state.tubes = dripResult.tubes;
        Audio_.drip();
        renderBoard();
        checkGameOverAndContinue();
      }, 120);
    }
  }
  updateDripUI();
  checkGameOverAndContinue();
}

function checkGameOverAndContinue(){
  if (isGameOver(state.tubes, CONFIG.TUBE_CAPACITY)){
    endGame();
  }
}

function endGame(){
  state.running = false;
  Audio_.gameOver();
  if (state.score > state.best){
    state.best = state.score;
  }
  persist();
  el.finalScore.textContent = state.score;
  el.bestLine.innerHTML = 'Best: <b>' + state.best + '</b>';
  updateScoreUI(false);
  setTimeout(function(){ el.gameover.classList.add('show'); }, 260);
}

/* Undo / Shuffle */
el.undoBtn.addEventListener('pointerdown', function(ev){
  ev.preventDefault();
  if (state.undoLeft <= 0 || !state.history || !state.running) return;
  const snap = state.history;
  state.tubes = snap.tubes;
  state.score = snap.score;
  state.combo = snap.combo;
  state.movesSinceComplete = snap.movesSinceComplete;
  state.movesSinceDrip = snap.movesSinceDrip;
  state.selected = null;
  state.history = null;
  state.undoLeft--;
  updateControlsUI();
  updateScoreUI(false);
  updateComboUI();
  updateDripUI();
  renderBoard();
});

el.shuffleBtn.addEventListener('pointerdown', function(ev){
  ev.preventDefault();
  if (state.shuffleLeft <= 0 || !state.running) return;
  Platform.showRewardedAd().then(function(){
    state.shuffleLeft--;
    state.selected = null;
    state.tubes = shuffleBoard(state.tubes, CONFIG.TUBE_CAPACITY);
    updateControlsUI();
    renderBoard();
    resolveAfterMove(-1);
  });
});

/* =========================================================================
   SETTINGS / MUTE / TUTORIAL
   ========================================================================= */
function persist(){
  Platform.saveData({
    best: state.best,
    patterns: state.settings.patterns,
    sound: state.settings.sound,
    seenTutorial: state.seenTutorial
  });
}

el.muteBtn.addEventListener('click', function(){
  state.settings.sound = !state.settings.sound;
  Platform.setAudioEnabled(state.settings.sound);
  el.muteBtn.textContent = state.settings.sound ? '🔊' : '🔇';
  el.soundSwitch.classList.toggle('on', state.settings.sound);
  persist();
});

el.settingsBtn.addEventListener('click', function(){
  el.settings.classList.add('show');
});
el.settingsClose.addEventListener('click', function(){
  el.settings.classList.remove('show');
});
el.patternSwitch.addEventListener('click', function(){
  state.settings.patterns = !state.settings.patterns;
  el.patternSwitch.classList.toggle('on', state.settings.patterns);
  renderBoard(true);
  persist();
});
el.soundSwitch.addEventListener('click', function(){
  state.settings.sound = !state.settings.sound;
  Platform.setAudioEnabled(state.settings.sound);
  el.soundSwitch.classList.toggle('on', state.settings.sound);
  el.muteBtn.textContent = state.settings.sound ? '🔊' : '🔇';
  persist();
});

el.tutorialDismiss.addEventListener('click', function(){
  el.tutorial.classList.remove('show');
  state.seenTutorial = true;
  persist();
});

el.playAgainBtn.addEventListener('click', function(){
  el.gameover.classList.remove('show');
  newGame();
});

/* =========================================================================
   PAUSE / RESUME
   ========================================================================= */
Platform.onPause(function(){
  state.paused = true;
});
Platform.onResume(function(){
  state.paused = false;
});

/* =========================================================================
   INIT
   ========================================================================= */
function init(){
  requestAnimationFrame(function(){
    Platform.firstFrameReady();
  });

  Platform.loadData().then(function(data){
    state.best = data && data.best ? data.best : 0;
    if (data && typeof data.patterns === 'boolean') state.settings.patterns = data.patterns;
    if (data && typeof data.sound === 'boolean') state.settings.sound = data.sound;
    state.seenTutorial = !!(data && data.seenTutorial);

    Platform.setAudioEnabled(state.settings.sound);
    el.soundSwitch.classList.toggle('on', state.settings.sound);
    el.patternSwitch.classList.toggle('on', state.settings.patterns);
    el.muteBtn.textContent = state.settings.sound ? '🔊' : '🔇';

    newGame();

    if (!state.seenTutorial){
      el.tutorial.classList.add('show');
    }

    Platform.gameReady();
  });
}

init();

})();
</script>
</body>
